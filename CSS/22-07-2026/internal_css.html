<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Styling</title>
    <style>
        
        /* Element / Tag selector */
        /* selector{
            property: value;
        } */
        
        h1{
            color: red;
            background-color: black;
        }
        /* class selector . -> use dot */ 
        .demo{
            background-color: red;
            color: white;
        }
        /* .demo{
            background-color: blue;
        } */
        /* id selector # -> use hash symbol */
       #sampleId{
            background-color: green;
            color: yellow;
        }
    </style>
</head>

<body>
    <h1>Hello World!</h1>
    <h1 id="sampleId">Hey</h1>
    <span class="demo">Hey</span>
    <p class="demo">Lorem ipsum dolor sit amet consectetur adipisicing elit. Perferendis, ut laudantium nisi, quas officia placeat doloribus non qui fugit distinctio nemo quos omnis vero est accusantium at impedit! Obcaecati, possimus?</p>
    <h1>Hello</h1>
</body>

</html>
