<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 2rem;
        }

        #app {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Layout styling */
        .product-container {
            display: flex;
            gap: 2.5rem;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .gallery {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .main-img {
            width: 100%;
            height: 400px;
            object-fit: contain;
            background: #f1f5f9;
            border-radius: 8px;
        }

        .thumbnails {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            background: #f1f5f9;
        }

        .thumb.active {
            border-color: #2563eb;
        }

        .details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            width: fit-content;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .discount {
            color: #dc2626;
            font-size: 1rem;
        }

        .reviews-container {
            margin-top: 2rem;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .review-card {
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 0;
        }

        .review-card:last-child {
            border-bottom: none;
        }

        .star-rating {
            color: #f59e0b;
        }
    </style>
</head>

<body>
    <div id="app">Loading product details...</div>

    <script src="./product.js"></script>
</body>

</html>
