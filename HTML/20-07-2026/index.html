<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Eg: John" value="Hello" name="username">
        <br>
        <input type="number" name="age" placeholder="Eg: 21">
        <input type="color">
        <input type="password">
        <input type="hidden" value="1234">

        checkbox:

        <input type="checkbox" name="tv" > Television
        <input type="checkbox" name="phone" value="on"> Phone
        <input type="checkbox" name="computer" value="on"> Computer
        <br>

        radio:

        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other

        <!-- select -->

        <select name="city">
            <option value="london">London</option>
            <option value="paris">Paris</option>
            <option value="berlin">Berlin</option>
            <option value="tokyo">Tokyo</option>
        </select>

        <textarea name="message" rows="5" placeholder="Write review"></textarea>

        <input type="submit" value="Button">
    </form>
